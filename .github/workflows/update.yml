name: Update Movie & Sports Hot Topics

on:
  workflow_dispatch:       # 仅保留手动/外部触发，删除 schedule

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run update script (with 3 retries)
        run: |
          for i in 1 2 3; do
            echo "===== Attempt $i/3 ====="
            python scripts/update_topics.py && exit 0
            echo "Attempt $i failed, waiting 20s before retry..."
            sleep 20
          done
          echo "All 3 attempts failed. Keeping previous data."
          exit 0

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hot_topics.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "update: hot topics $(date +'%Y-%m-%d %H:%M')"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
